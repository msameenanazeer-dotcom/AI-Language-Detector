<!DOCTYPE html>
<html>
<head>
    <title>AI Language Detector</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

<h1>🌍 AI Language Detector</h1>

<form method="POST">

<textarea name="text"
placeholder="Enter text..."
required></textarea>

<button type="submit">Detect Language</button>

</form>

{% if result %}
<h2>Language: {{ result }}</h2>
{% endif %}

</div>

</body>
</html>
